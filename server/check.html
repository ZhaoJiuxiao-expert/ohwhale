<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>哦鲸鲸网络验收</title><style>body{font:16px system-ui;max-width:760px;margin:30px auto;padding:15px;background:#eff6fc;color:#173652}label{display:block;margin:14px 0}input,textarea{display:block;width:95%;padding:10px}button{padding:12px;margin:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>网络验收工具</h1><p>仅发送标记的 RTC 测试消息，不调用 AI。强制 TURN 中继；两台设备分别在不同网络打开本页，填写真实环境名称。报告不会自动证明跨 NAT。</p><label>当前环境说明（如 Windows 家庭 Wi-Fi / Android 手机蜂窝）<input id="label"></label><label>仅创建方填写服务器创建令牌（仅本页内存，不保存）<input id="token" type="password" autocomplete="off"></label><button id="create">生成测试邀请码</button><label>邀请码<textarea id="code" rows="4"></textarea></label><button id="join">加入邀请</button><button id="probe">发送验收消息</button><button id="export">显示无敏感项报告</button><button id="close">关闭连接</button><pre id="status">尚未连接</pre><pre id="result"></pre><script type="module" src="/client/check.js"></script></html>
